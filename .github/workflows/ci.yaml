name: ci

# Every change reaches main through a pull request whose branch must be up to date with main
# before it merges, so the merge commit carries the tree the pull request already tested.
on:
  pull_request:

# Nothing here writes to the repository: the suite reads the tree and reports. Declaring it means
# a job that starts wanting more fails rather than inheriting whatever the default happens to be.
permissions:
  contents: read
  pull-requests: read

# Path buckets decide which expensive steps run. Required job names (shellcheck, validate,
# bats (1-6), bats-macos (1-6), windows-native (powershell), windows-native (pwsh)) always
# start so a docs-only or Release Please pull request is not left waiting on a check that
# never reported. Workflow-level `paths` would skip the whole workflow and revive that
# pending state. A job that only reports a skip runs on Linux, where a runner is available
# at once. windows-native stays on windows-latest: its steps use shell: powershell / pwsh,
# which GitHub cannot parse on Ubuntu.
#
# The filter matches a file when any one pattern matches it, and a `!` pattern matches every
# file but the one it names. The plugin tree is therefore filtered in its own step under the
# `every` quantifier, where a file must match `plugins/**` and each exclusion.
#
# What a change can break decides what runs. Code, tests, templates the runtime copies, and the
# workflow run the full matrix. Plugin prose alone (skills, references, catalog entries) runs the
# skills contract on shard 1: catalog discovery on both runtimes, references, frontmatter, evals
# and fixtures. Docs alone run the docs contract: links, paths, named commands and issue forms.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.class.outputs.suite }}
      lint: ${{ steps.class.outputs.lint }}
      validate: ${{ steps.class.outputs.validate }}
      docs: ${{ steps.class.outputs.docs }}
      prose: ${{ steps.class.outputs.prose }}
      classified_at: ${{ steps.class.outputs.classified_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: listed
        with:
          list-files: json
          filters: |
            all:
              - '**'
      - name: Classify changes
        id: class
        env:
          ALL_FILES: ${{ steps.listed.outputs.all_files }}
        run: |
          set -eu
          python3 - <<'PY' >"${RUNNER_TEMP}/changed-paths.txt"
          import json, os
          raw = os.environ.get("ALL_FILES", "").strip()
          if not raw:
              raise SystemExit(0)
          files = json.loads(raw) if raw.startswith("[") else [line for line in raw.splitlines() if line]
          print("\n".join(files))
          PY
          tests/ci-paths.sh <"${RUNNER_TEMP}/changed-paths.txt" >>"$GITHUB_OUTPUT"
          printf 'classified_at=%s\n' "$(date +%s)" >>"$GITHUB_OUTPUT"

  shellcheck:
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful change classification
        if: needs.changes.result != 'success'
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
        run: |
          echo "change classification $CLASSIFICATION"
          exit 1
      - name: Skip lint
        if: needs.changes.outputs.lint != 'true'
        run: echo 'No shell or workflow paths; shellcheck not executed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.lint == 'true'
      - name: Install shellcheck
        if: needs.changes.outputs.lint == 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every shell script
        if: needs.changes.outputs.lint == 'true'
        run: |
          set -eu
          chmod +x tests/lint-shell.sh
          tests/lint-shell.sh

  bats:
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Require a successful change classification
        if: needs.changes.result != 'success'
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
        run: |
          echo "change classification $CLASSIFICATION"
          exit 1
      - name: Skip shard
        if: needs.changes.outputs.suite != 'true' && ((needs.changes.outputs.docs != 'true' && needs.changes.outputs.prose != 'true') || matrix.shard != 1)
        run: echo 'No suite paths for this shard.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.suite == 'true' || ((needs.changes.outputs.docs == 'true' || needs.changes.outputs.prose == 'true') && matrix.shard == 1)
      - name: Install bats and shellcheck
        if: needs.changes.outputs.suite == 'true'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Run bats shard ${{ matrix.shard }}/6
        if: needs.changes.outputs.suite == 'true'
        env:
          NIGHTSHIFT_CLASSIFIED_AT: ${{ needs.changes.outputs.classified_at }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          if ! ls tests/*.bats >/dev/null 2>&1; then
            echo "no bats tests yet"
            exit 0
          fi
          chmod +x tests/run-shard.sh
          tests/run-shard.sh "$SHARD" 6
      - name: Install bats
        if: needs.changes.outputs.suite != 'true' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.prose == 'true') && matrix.shard == 1
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run docs contract
        if: needs.changes.outputs.suite != 'true' && needs.changes.outputs.docs == 'true' && matrix.shard == 1
        run: |
          set -eu
          chmod +x tests/run-docs-contract.sh
          tests/run-docs-contract.sh
      - name: Run skills contract
        if: needs.changes.outputs.suite != 'true' && needs.changes.outputs.prose == 'true' && matrix.shard == 1
        env:
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
        run: |
          set -eu
          chmod +x tests/run-skills-contract.sh
          if [ "$DOCS_CHANGED" = "true" ]; then
            tests/run-skills-contract.sh --skip-shared
          else
            tests/run-skills-contract.sh
          fi

  bats-macos:
    needs: changes
    if: always() && !cancelled()
    runs-on: ${{ needs.changes.outputs.suite == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Require a successful change classification
        if: needs.changes.result != 'success'
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
        run: |
          echo "change classification $CLASSIFICATION"
          exit 1
      - name: Skip shard
        if: needs.changes.outputs.suite != 'true'
        run: echo 'No suite paths; macOS shard not executed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.suite == 'true'
      - name: Install bats
        if: needs.changes.outputs.suite == 'true'
        run: brew install bats-core
      - name: Run bats shard ${{ matrix.shard }}/6 under macOS system bash
        if: needs.changes.outputs.suite == 'true'
        env:
          NIGHTSHIFT_CLASSIFIED_AT: ${{ needs.changes.outputs.classified_at }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          bats_bin="$(command -v bats)"
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin"
          export PATH
          command -v bash
          bash --version
          chmod +x tests/run-shard.sh
          tests/run-shard.sh "$SHARD" 6

  windows-native:
    needs: changes
    if: always() && !cancelled()
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Require a successful change classification
        if: needs.changes.result != 'success'
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
        run: |
          echo "change classification $CLASSIFICATION"
          exit 1
      - name: Skip suite
        if: needs.changes.outputs.suite != 'true'
        run: echo 'No suite paths; Windows native suite not executed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.suite == 'true'
      - name: Run native Windows lifecycle suite
        if: needs.changes.outputs.suite == 'true'
        run: ./tests/windows/run.ps1

  remote-ssh:
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure an ephemeral OpenSSH target
        run: |
          set -eu
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cp "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo service ssh restart
          ssh-keyscan -H 127.0.0.1 >>"$HOME/.ssh/known_hosts" 2>/dev/null
      - name: Cross SSH, disconnect, and verify the remote watchman
        run: |
          set -eu
          mkdir -p artifacts
          bash tests/environments/run-remote-ssh.sh \
            "$USER@127.0.0.1" "$GITHUB_WORKSPACE" \
            >artifacts/remote-ssh-linux.json
          cmp tests/environments/receipts/remote-ssh-linux.json \
            artifacts/remote-ssh-linux.json
      - name: Upload the sanitized receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-remote-ssh
          path: artifacts/remote-ssh-linux.json
          if-no-files-found: ignore

  devcontainer:
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Start the checked-in devcontainer
        run: |
          npm install -g @devcontainers/cli@0.88.0
          devcontainer up \
            --workspace-folder . \
            --config tests/environments/devcontainer/devcontainer.json
      - name: Verify the co-located container runtime
        run: |
          set -eu
          mkdir -p artifacts
          dc_exec() {
            devcontainer exec \
              --workspace-folder . \
              --config tests/environments/devcontainer/devcontainer.json \
              "$@"
          }
          fixture="$(dc_exec mktemp -d /tmp/nightshift-environment.XXXXXX)"
          cleanup() {
            dc_exec bash tests/environments/disconnect-watchman.sh cleanup \
              /workspaces/nightshift "$fixture"
          }
          cleanup_best_effort() { cleanup >/dev/null 2>&1 || true; }
          trap cleanup_best_effort EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          dc_exec bash tests/environments/probe.sh devcontainer /workspaces/nightshift \
            >artifacts/devcontainer-base.json
          dc_exec bash tests/environments/disconnect-watchman.sh start \
            /workspaces/nightshift "$fixture"
          dc_exec bash tests/environments/disconnect-watchman.sh verify \
            /workspaces/nightshift "$fixture"
          cleanup
          trap - EXIT INT TERM
          jq '.checks.transportDisconnect = "pass"' \
            artifacts/devcontainer-base.json >artifacts/devcontainer-linux.json
          rm -f artifacts/devcontainer-base.json
          cmp tests/environments/receipts/devcontainer-linux.json \
            artifacts/devcontainer-linux.json
      - name: Upload the sanitized receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-devcontainer
          path: artifacts/devcontainer-linux.json
          if-no-files-found: ignore

  validate:
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful change classification
        if: needs.changes.result != 'success'
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
        run: |
          echo "change classification $CLASSIFICATION"
          exit 1
      - name: Skip validate
        if: needs.changes.outputs.validate != 'true'
        run: echo 'No manifest, runtime, or workflow paths; validate not executed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.validate == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.validate == 'true'
        with:
          node-version: 20
      - name: Install Claude Code
        if: needs.changes.outputs.validate == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        if: needs.changes.outputs.validate == 'true'
        run: claude plugin validate . --strict
