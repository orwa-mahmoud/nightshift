name: HOL Plugin Scanner

# Listing gate for the Codex plugin directory: this filename, Action, score, and
# severity threshold are what the directory checks for. It is a separate workflow
# because SARIF upload needs security-events, which the rest of CI does not.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - '.cursor-plugin/**'
      - '.github/workflows/hol-plugin-scanner.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - '.cursor-plugin/**'
      - '.github/workflows/hol-plugin-scanner.yml'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@013b123a036a252a6d74ddb52836ee923498150c # v1.2.817
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
      - name: Record scan findings
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("ai-plugin-scanner.sarif")
          if not path.is_file():
              print("no sarif report")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          count = 0
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  count += 1
                  rule = result.get("ruleId", "")
                  level = result.get("level", "")
                  message = ((result.get("message") or {}).get("text") or "").replace("\n", " ")
                  uri = ""
                  locations = result.get("locations") or []
                  if locations:
                      uri = (
                          ((locations[0].get("physicalLocation") or {}).get("artifactLocation") or {}).get("uri")
                          or ""
                      )
                  print(f"{level}\t{rule}\t{uri}\t{message[:400]}")
          print(f"results {count}")
          PY
