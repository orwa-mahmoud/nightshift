name: HOL Plugin Scanner

# Listing gate for the Codex plugin directory: this filename, Action, score, and
# severity threshold are what the directory checks for. It is a separate workflow
# because SARIF upload needs security-events, which the rest of CI does not.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - '.cursor-plugin/**'
      - '.github/workflows/hol-plugin-scanner.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - '.cursor-plugin/**'
      - '.github/workflows/hol-plugin-scanner.yml'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@18db10e4a3f4e91b9911288a7be3f077f851de90 # v1.2.641
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
