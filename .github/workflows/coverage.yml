name: coverage

# Line coverage of the shipped bash on main, uploaded to Codecov. Two Linux runners
# trace disjoint groups and a merge job publishes one report. Pull requests run the
# suite in ci.yaml without coverage; this workflow never gates one.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tests/**"
      - "codecov.yml"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure line coverage
        env:
          NIGHTSHIFT_COVERAGE_SHARD: ${{ matrix.shard }}
          NIGHTSHIFT_COVERAGE_SHARDS: 2
        run: bash tests/coverage.sh
      - name: Upload the shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}
          if-no-files-found: error

  merge:
    name: Coverage merge
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: coverage-incoming
      - name: Place shard reports
        run: |
          set -eu
          mkdir -p coverage
          for dir in coverage-incoming/coverage-shard-*; do
            n="${dir##*-}"
            mkdir -p "coverage/shard-$n"
            cp -a "$dir"/. "coverage/shard-$n/"
          done
      - name: Merge shard reports
        run: bash tests/coverage.sh --merge
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          disable_search: true
          fail_ci_if_error: true
