name: release-please

# Work lands on main without publishing anything. This keeps one pull request open — "chore:
# release x.y.z" — holding the next version and its changelog, and refreshes it on every merge.
# Merging that pull request is the release: it tags the commit and creates the GitHub release.
#
# Commit subjects decide the version: `fix:` a patch, `feat:` a minor. A `!` or BREAKING
# CHANGE footer is a major only at 1.x; on 0.x it is a minor, so 1.0.0 stays an explicit
# decision. Subjects that reach no user — docs, chore, ci, test, refactor — open nothing.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag the commit and create the release
      pull-requests: write # open and refresh the release pull request
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Not GITHUB_TOKEN: a pull request it opens triggers no workflows, so the release
          # pull request would carry none of the checks main requires and could never merge.
          # A repository-scoped token also keeps "Actions may create pull requests" switched
          # off, which would otherwise grant every workflow here the right to approve them.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
