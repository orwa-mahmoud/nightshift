name: Catalog shift proposal
description: Propose a ready-made shift. An idea is enough; you do not need to know how Nightshift would run it.
title: "[catalog]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe work you would hand an agent while you are away. Rough is fine. Discussion of shift
        ideas also happens on [#21](https://github.com/orwa-mahmoud/nightshift/issues/21).

        To contribute a working entry instead, open a pull request with one file:
        [Add to a catalog](https://github.com/orwa-mahmoud/nightshift/blob/main/docs/add-to-a-catalog.md).
  - type: input
    id: name
    attributes:
      label: Shift name
      description: "Short title, e.g. Documentation drift."
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: The work
      description: What the agent would do, and what you would want to find when you come back.
    validations:
      required: true
  - type: dropdown
    id: ending
    attributes:
      label: How it ends
      description: Finite work is a known list that stops when it is clear. Open-ended work runs until the clock.
      options:
        - finite — ends when the list is clear
        - open-ended — ends at quitting time
        - not sure
    validations:
      required: false
  - type: textarea
    id: refusals
    attributes:
      label: What it must never do
      description: Anything an unattended agent must not reach for while doing this work.
    validations:
      required: false
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A project, a command, or a result that shows the shift working.
    validations:
      required: false
