# Picked up automatically by sonar-scanner when run from this folder.
#
#   SONAR_TOKEN=… SONAR_HOST_URL=http://localhost:9000 sonar-scanner
#
# The token is per-project and belongs in your own gitignored .env, never here.

sonar.projectKey=nightshift
sonar.projectName=Nightshift

sonar.sources=plugins,docs,examples,evals,README.md,CONTRIBUTING.md,AGENTS.md,SECURITY.md,CODE_OF_CONDUCT.md
sonar.tests=tests

# The plugin ships no compiled language. What Sonar reads here is the shipped JSON — manifests,
# schemas, the rules template — the Markdown, and every file the secrets analyzer inspects, which
# is the check that matters most for a repository this one is published from.
# Only generated output is excluded. The test fixtures stay in: deliberately malformed JUnit,
# unterminated CDATA and invalid rules files are data rather than code, and the shell among them
# is analysed like everything else.
sonar.exclusions=**/coverage/**,evals/reports/**

sonar.sourceEncoding=UTF-8

# Line coverage over the shipped bash, produced by tests/coverage.sh (kcov over the bats suite)
# and converted to Sonar's generic format. Regenerate before a scan; the report is not committed.
sonar.coverageReportPaths=coverage/sonar-generic.xml
